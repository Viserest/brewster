[package]
name = "brewster"
version = "0.1.0"
edition = "2024"

[features]
# The GUI backend is chosen at compile time. egui is the only one implemented.
default = ["egui"]
egui = ["dep:eframe"]
# Planned backends. Selecting one is a compile error until it is implemented.
iced = []
slint = []

[dependencies]
engine = { path = "../../crates/engine" }
browser = { path = "../../crates/browser" }
profile = { path = "../../crates/profile" }
eframe = { version = "0.29", optional = true }
